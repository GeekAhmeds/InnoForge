name: POS installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/pos/**'
      - '.github/workflows/pos-installer.yml'

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/pos/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: InnoForge-POS-Windows-Setup
          path: apps/pos/release/*.exe
          retention-days: 30

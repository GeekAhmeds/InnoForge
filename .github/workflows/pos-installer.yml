name: POS installer

# Every push builds signed Windows and Linux installers + the update files as artifacts, and
# a GitHub pre-release "pos-v<version>" (job "release"). Marking a release as the latest on
# GitHub sends it to customers: the office server pulls it (no SSH or secrets needed).
# The older SSH upload (job "publish", POS_DEPLOY_* secrets) still works when configured.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   POS_SIGNING_KEY   contents of pos-license-private.pem (signs updates; required to publish)
#   POS_DEPLOY_HOST   server host name for upload over SSH, e.g. ls.0x01source.com (the office server inno)
#   POS_DEPLOY_PORT   SSH port (default 22)
#   POS_DEPLOY_USER   SSH user that can write to the update folder
#   POS_DEPLOY_KEY    SSH private key for that user
#   POS_DEPLOY_PATH   folder served at https://pos.0x01source.com:9990/updates/ (/srv/InnoForge/PoS on inno)
#   Optional, when the update server is not reachable from the internet (e.g. an office
#   server behind a public front server): SSH goes through that front server first.
#   POS_DEPLOY_PROXY_HOST, POS_DEPLOY_PROXY_PORT (default 22), POS_DEPLOY_PROXY_USER, POS_DEPLOY_PROXY_KEY

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload this build to the update server
        type: boolean
        default: false
  push:
    paths:
      - 'apps/pos/**'
      - '.github/workflows/pos-installer.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            label: Windows
          - os: ubuntu-latest
            target: linux
            label: Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/pos/package-lock.json
      - run: npm ci
      - run: npm test

      # major.minor come from package.json; the patch number always increases with each run,
      # so every build is newer than the last one installed.
      - name: Version
        shell: bash
        run: echo "POS_VERSION=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')").${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build signed installer
        run: npm run dist:${{ matrix.target }}
        env:
          POS_SIGNING_KEY: ${{ secrets.POS_SIGNING_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: InnoForge-POS-${{ matrix.label }}-${{ env.POS_VERSION }}
          path: |
            apps/pos/release/*.exe
            apps/pos/release/*.AppImage
            apps/pos/release/*.deb
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: update-server-files-${{ matrix.label }}-${{ env.POS_VERSION }}
          path: apps/pos/release/update/
          retention-days: 30

  # Every build also becomes a GitHub *pre-release* "pos-v<version>" with the signed update files
  # (installers included). Nothing reaches customers until you open it on GitHub → Releases and
  # tick "Set as the latest release": the office server (inno) checks every 10 minutes and pulls
  # the latest release into the update folder (apps/license-server/deploy/updates-sync.sh).
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.publish
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/pos/package.json
      - name: Version
        run: echo "POS_VERSION=$(node -p "require('./apps/pos/package.json').version.split('.').slice(0,2).join('.')").${{ github.run_number }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: update-server-files-*
          path: update
          merge-multiple: true
      - name: Create the pre-release
        run: |
          ls -la update
          if ! ls update/*.sig >/dev/null 2>&1; then echo "::error::unsigned build (POS_SIGNING_KEY missing) — not released"; exit 1; fi
          {
            echo "InnoForge POS ${POS_VERSION} — branch \`${GITHUB_REF_NAME}\`, commit ${GITHUB_SHA::7}"
            echo
            git log -1 --format=%B "${GITHUB_SHA}" 2>/dev/null | head -20 || true
            echo
            echo "To send this version to customers: Edit → untick «Set as a pre-release» → tick «Set as the latest release» → Update release."
          } > notes.md
          gh release create "pos-v${POS_VERSION}" update/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "InnoForge POS ${POS_VERSION}" --notes-file notes.md --prerelease
      - name: Keep only the last 8 pre-releases
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease,isLatest \
            --jq '[.[] | select(.isPrerelease and (.isLatest|not) and (.tagName|startswith("pos-v")))] | .[8:] | .[].tagName' |
          while read -r tag; do gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; done

  # Collects both platforms' update files and uploads them in one go (scp-action needs a Linux runner).
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: inputs.publish || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      HAS_DEPLOY: ${{ secrets.POS_DEPLOY_HOST != '' && secrets.POS_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: update-server-files-*
          path: update
          merge-multiple: true
      - name: Check publish requirements
        id: check
        shell: bash
        run: |
          ls -la update
          if ! ls update/*.sig >/dev/null 2>&1; then
            echo "::error::POS_SIGNING_KEY secret is missing: installed apps would reject this update."; exit 1
          fi
          if [ "$HAS_DEPLOY" != "true" ]; then
            if [ "${{ inputs.publish }}" = "true" ]; then echo "::error::POS_DEPLOY_* secrets are not set."; exit 1; fi
            echo "::notice::Deploy secrets not set — skipping the upload. Download the update-server-files artifacts and upload them by hand."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload to update server
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.POS_DEPLOY_HOST }}
          port: ${{ secrets.POS_DEPLOY_PORT || 22 }}
          username: ${{ secrets.POS_DEPLOY_USER }}
          key: ${{ secrets.POS_DEPLOY_KEY }}
          source: update/*
          target: ${{ secrets.POS_DEPLOY_PATH }}
          strip_components: 1
          proxy_host: ${{ secrets.POS_DEPLOY_PROXY_HOST }}
          proxy_port: ${{ secrets.POS_DEPLOY_PROXY_PORT || 22 }}
          proxy_username: ${{ secrets.POS_DEPLOY_PROXY_USER }}
          proxy_key: ${{ secrets.POS_DEPLOY_PROXY_KEY }}

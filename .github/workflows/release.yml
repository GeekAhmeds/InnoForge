# Build installers and publish them. Azim Command tags are prefixed so they
# never clash with other Inno products in this repo (e.g. pos-v*):
#   git tag azim-v0.2.0 && git push origin azim-v0.2.0
# Installers are attached to a GitHub Release and uploaded to the Inno server
# (set repository secrets INNO_SERVER_URL and INNO_PUBLISH_TOKEN), where every
# running copy of the app picks them up automatically.
name: Release desktop app

on:
  push:
    tags: ['azim-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/azim-v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#azim-v}" --no-git-tag-version --allow-same-version
      - run: npm run dist:${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: azim-command-${{ matrix.target }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/latest*.yml
          if-no-files-found: error
      - name: Publish to the Inno server
        shell: bash
        env:
          INNO_SERVER_URL: ${{ secrets.INNO_SERVER_URL }}
          INNO_PUBLISH_TOKEN: ${{ secrets.INNO_PUBLISH_TOKEN }}
        run: node ../../scripts/publish-release.mjs ${{ matrix.target }} dist
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/azim-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Azim Command ${{ github.ref_name }}
          files: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb

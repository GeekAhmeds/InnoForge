# Build installers and publish them. Azim Command tags are prefixed so they
# never clash with other Inno products in this repo (e.g. pos-v*):
#   git tag azim-v0.2.0 && git push origin azim-v0.2.0
# Installers and update manifests are attached to a GitHub Release (never
# marked "Latest", which belongs to the POS). The Inno server pulls the newest
# azim-v* release every 10 minutes (apps/inno-server/deploy/azim-updates-sync.sh),
# the same way the POS update server works, so no secrets are needed here.
# Optional push instead: set INNO_SERVER_URL and INNO_PUBLISH_TOKEN secrets.
name: Release desktop app

# Also runs for a push to an azim branch whose commit message contains
# [release]; it then builds the version in package.json and creates the
# azim-v<version> tag and GitHub Release itself.
on:
  push:
    tags: ['azim-v*']
    branches: ['claude/azim-*', 'main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/azim-v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#azim-v}" --no-git-tag-version --allow-same-version
      - run: npm run dist:${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: azim-command-${{ matrix.target }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/latest*.yml
          if-no-files-found: error
      - name: Publish to the Inno server
        shell: bash
        env:
          INNO_SERVER_URL: ${{ secrets.INNO_SERVER_URL }}
          INNO_PUBLISH_TOKEN: ${{ secrets.INNO_PUBLISH_TOKEN }}
        run: node ../../scripts/publish-release.mjs ${{ matrix.target }} dist
      - name: Release version
        id: ver
        shell: bash
        run: echo "tag=azim-v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Azim Command ${{ steps.ver.outputs.tag }}
          # Never take the repo's "Latest" badge: the POS update server pulls
          # whatever release is "Latest" (apps/license-server/deploy/updates-sync.sh).
          make_latest: false
          # The update manifests and blockmaps let the Inno server pull a release
          # (apps/inno-server/deploy/azim-updates-sync.sh) without any secrets here.
          files: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.exe.blockmap
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/latest*.yml

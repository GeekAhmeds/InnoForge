name: POS videos

# Records the tutorial videos and the promo from the real app, then adds an Egyptian-Arabic
# voice-over (Microsoft neural voices through edge-tts) and subtitles. Run it by hand from
# the Actions tab; download the "InnoForge-POS-videos" artifact when it finishes.
on:
  workflow_dispatch:
    inputs:
      voice:
        description: Voice
        type: choice
        options:
          - ar-EG-SalmaNeural
          - ar-EG-ShakirNeural
        default: ar-EG-SalmaNeural
      rate:
        description: Speaking speed (e.g. +0%, +10%, -5%)
        default: '+0%'
  # Also re-made automatically when the video scripts change (manual runs need the
  # workflow on the default branch).
  push:
    paths:
      - 'apps/pos/tools/videos/**'
      - '.github/workflows/pos-videos.yml'

jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/pos/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: System packages (virtual display, ffmpeg, Arabic fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg fonts-noto-core fonts-noto-color-emoji fonts-kacst
      - run: npm ci
      - name: Playwright + Chromium (for the promo)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: pip install edge-tts
      - run: npm run build

      - name: Record tutorials
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" node tools/videos/record.cjs release/videos
      - name: Record promo
        run: node tools/videos/promo.cjs tools/videos/promo-assets release/videos/00-promo.mp4
      - name: Egyptian voice-over
        run: python3 tools/videos/voiceover.py release/videos --voice "${{ inputs.voice || 'ar-EG-SalmaNeural' }}" --rate "${{ inputs.rate || '+0%' }}" --out release/videos/voiced
      - name: Subtitles next to the voiced videos
        run: cp release/videos/*.srt release/videos/voiced/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: InnoForge-POS-videos
          path: apps/pos/release/videos/voiced/
          retention-days: 30

# /etc/nginx/sites-available/licenses — HTTPS in front of the container (port 8020).
server {
    listen 443 ssl;
    server_name licenses.0x01source.com;
    ssl_certificate     /etc/letsencrypt/live/0x01source.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/0x01source.com-0001/privkey.pem;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
server { listen 80; server_name licenses.0x01source.com; return 301 https://$host$request_uri; }

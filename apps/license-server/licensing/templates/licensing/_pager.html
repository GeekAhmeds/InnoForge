{% if page.paginator.num_pages > 1 %}<div class="pager">
  {% if page.has_previous %}<a class="btn" href="?{% for k,v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.previous_page_number }}">→ السابق</a>{% endif %}
  <span class="muted">صفحة {{ page.number }} من {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn" href="?{% for k,v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.next_page_number }}">التالي ←</a>{% endif %}
</div>{% endif %}

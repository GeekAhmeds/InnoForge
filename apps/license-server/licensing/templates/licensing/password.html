{% extends 'licensing/base.html' %}
{% block title %}كلمة السر{% endblock %}
{% block content %}
<div class="head"><h1>🔒 تغيير كلمة السر</h1></div>
<form method="post" class="card" style="max-width:460px">{% csrf_token %}
  {% for f in form %}<label style="margin-bottom:10px">{{ f.label }}{{ f }}{% for e in f.errors %}<span class="bad">{{ e }}</span>{% endfor %}</label>{% endfor %}
  <button class="btn primary">حفظ</button>
</form>
{% endblock %}

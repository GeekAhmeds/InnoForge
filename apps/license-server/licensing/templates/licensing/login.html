{% extends 'licensing/base.html' %}
{% block title %}الدخول{% endblock %}
{% block anon %}
<div class="login-wrap">
  <form class="login-card" method="post">{% csrf_token %}
    <h1 style="margin-bottom:4px">🔑 InnoForge</h1>
    <p class="muted" style="margin-top:0">بوابة التراخيص — Inno Source وشركاؤها</p>
    {% if form.errors %}<p class="bad">اسم الدخول أو كلمة السر غلط</p>{% endif %}
    <label>اسم الدخول<input name="username" autofocus required autocomplete="username"></label>
    <label style="margin-top:10px">كلمة السر<input type="password" name="password" required autocomplete="current-password"></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn primary" style="width:100%;margin-top:16px">دخول</button>
  </form>
</div>
{% endblock %}

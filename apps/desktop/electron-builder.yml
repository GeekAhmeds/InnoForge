appId: com.innosource.azimcommand
productName: Azim Command
copyright: Copyright © Inno Source For Software Solutions
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - '**/*.node'
win:
  target:
    - target: nsis
      arch: [x64]
  # No spaces: GitHub turns them into dots, which would break the names in latest.yml.
  artifactName: Azim.Command-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: Azim Command
linux:
  target: [AppImage, deb]
  category: Office
  maintainer: Inno Source For Software Solutions
  artifactName: Azim.Command-${version}-${arch}.${ext}
mac:
  target: [dmg, zip]
  category: public.app-category.finance
  artifactName: Azim.Command-${version}-${arch}.${ext}
# Auto-update feed on the Inno server (Inno Source For Software Solutions),
# under this app's namespace. The app can override the server URL at runtime
# from Settings (see src/main/updater.ts).
publish:
  provider: generic
  url: https://azim.0x01source.com:9990/updates/azim-command/${os}
  channel: latest
